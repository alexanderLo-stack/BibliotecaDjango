<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca | Login</title>
</head>
<body>

    <h1>Biblioteca</h1>
    <h2>Iniciar sesión</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Usuario</label>
        <input type="text" name="usuario" required>

        <br><br>

        <label>Contraseña</label>
        <input type="password" name="clave" required>

        <br><br>

        <button type="submit">Ingresar</button>
    </form>

    {% if mensaje %}
        <p>{{ mensaje }}</p>
    {% endif %}

</body>
</html>
