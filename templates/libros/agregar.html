<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Agregar libro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f1ea;
            color: #333;
        }

        header {
            background: #24352b;
            color: white;
            padding: 18px 40px;
        }

        header h1 {
            font-size: 24px;
        }

        .contenedor {
            max-width: 600px;
            margin: 45px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
        }

        h2 {
            color: #24352b;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #496b57;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .checkbox input {
            width: auto;
            margin: 0;
        }

        .botones {
            display: flex;
            gap: 10px;
        }

        button,
        .volver {
            padding: 12px 18px;
            border-radius: 7px;
            text-decoration: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }

        button {
            background: #24352b;
            color: white;
        }

        button:hover {
            background: #36513f;
        }

        .volver {
            background: #ddd;
            color: #333;
        }

        @media (max-width: 650px) {
            .contenedor {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Biblioteca</h1>
    </header>

    <div class="contenedor">

        <h2>Agregar libro</h2>
        <p class="subtitulo">Ingresa los datos del nuevo libro.</p>

        <form method="POST">
            {% csrf_token %}

            <label>Título</label>
            <input
                type="text"
                name="titulo"
                required
            >

            <label>Autor</label>
            <input
                type="text"
                name="autor"
                required
            >

            <label>Género</label>
            <input
                type="text"
                name="genero"
                required
            >

            <label>Fecha de publicación</label>
            <input
                type="date"
                name="fecha_publicacion"
                required
            >

            <div class="checkbox">
                <input
                    type="checkbox"
                    name="disponible"
                    checked
                >

                <label>Disponible</label>
            </div>

            <div class="botones">
                <button type="submit">
                    Guardar libro
                </button>

                <a href="#" class="volver">
                    Volver
                </a>
            </div>

        </form>

    </div>

</body>
</html>
