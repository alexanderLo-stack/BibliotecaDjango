<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Agregar libro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f1ea;
        }

        header {
            background: #24352b;
            color: white;
            padding: 18px 40px;
        }

        .contenedor {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
        }

        h2 {
            color: #24352b;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .check input {
            width: auto;
            margin: 0;
        }

        .check label {
            margin: 0;
        }

        .botones {
            display: flex;
            gap: 10px;
        }

        button {
            background: #24352b;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .volver {
            background: #ddd;
            color: #333;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Biblioteca</h1>
    </header>

    <div class="contenedor">

        <h2>Agregar libro</h2>

        <p class="subtitulo">
            Completa los datos del libro.
        </p>

        <form method="POST">

            {% csrf_token %}

            <label>Título</label>
            <input
                type="text"
                name="titulo"
                required
            >

            <label>Autor</label>
            <input
                type="text"
                name="autor"
                required
            >

            <label>Género</label>
            <input
                type="text"
                name="genero"
                required
            >

            <label>Fecha de publicación</label>
            <input
                type="date"
                name="fecha_publicacion"
                required
            >

            <div class="check">

                <input
                    type="checkbox"
                    name="disponible"
                    checked
                >

                <label>Disponible</label>

            </div>

            <div class="botones">

                <button type="submit">
                    Guardar libro
                </button>

                <a href="/inicio/" class="volver">
                    Volver
                </a>

            </div>

        </form>

    </div>

</body>
</html>
