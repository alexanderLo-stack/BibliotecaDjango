<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Editar libro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f1ea;
            color: #333;
        }

        header {
            background: #24352b;
            color: white;
            padding: 18px 40px;
        }

        .contenedor {
            max-width: 600px;
            margin: 45px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
        }

        h2 {
            color: #24352b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .checkbox input {
            width: auto;
            margin: 0;
        }

        .botones {
            display: flex;
            gap: 10px;
        }

        button,
        .volver {
            padding: 12px 18px;
            border-radius: 7px;
            border: none;
            text-decoration: none;
            font-size: 15px;
        }

        button {
            background: #24352b;
            color: white;
            cursor: pointer;
        }

        .volver {
            background: #ddd;
            color: #333;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Biblioteca</h1>
    </header>

    <div class="contenedor">

        <h2>Editar libro</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Título</label>
            <input
                type="text"
                name="titulo"
                value="{{ libro.titulo }}"
                required
            >

            <label>Autor</label>
            <input
                type="text"
                name="autor"
                value="{{ libro.autor }}"
                required
            >

            <label>Género</label>
            <input
                type="text"
                name="genero"
                value="{{ libro.genero }}"
                required
            >

            <label>Fecha de publicación</label>
            <input
                type="date"
                name="fecha_publicacion"
                value="{{ libro.fecha_publicacion|date:'Y-m-d' }}"
                required
            >

            <div class="checkbox">
                <input
                    type="checkbox"
                    name="disponible"
                    {% if libro.disponible %}checked{% endif %}
                >

                <label>Disponible</label>
            </div>

            <div class="botones">

                <button type="submit">
                    Guardar cambios
                </button>

                <a href="#" class="volver">
                    Volver
                </a>

            </div>

        </form>

    </div>

</body>
</html>
